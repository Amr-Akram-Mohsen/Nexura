[tool.ruff]
line-length = 160
target-version = "py312"
exclude = [
    ".git",
    "venv",
    "__pycache__",
    "instance",
    "migrations",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
