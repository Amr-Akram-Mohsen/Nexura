{% extends "base.html" %}

{% block title %}{{ title }} — Nexura{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}

{% block content %}
<div class="container">
  <div class="empty-state">
    {% if success %}
    <svg class="empty-state__icon empty-state__icon--success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    {% else %}
    <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    {% endif %}

    <h1 class="empty-state__title">{{ title }}</h1>
    <p class="empty-state__desc">{{ message }}</p>

    <div class="empty-state__actions">
      <a class="btn btn--gradient" href="{{ url_for('public.home') }}">Go to Homepage</a>
      <a class="btn btn--secondary" href="{{ url_for('public.search') }}">Explore Stories</a>
    </div>
  </div>
</div>
{% endblock %}
