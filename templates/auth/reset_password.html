{% extends "auth/base_auth.html" %}

{% block title %}Reset Password{% endblock %}

{% block extra_js %}
<script>
  document.getElementById('password').addEventListener('input', function() {
    const pw = this.value;
    const bar = document.getElementById('pw-strength-bar');
    const label = document.getElementById('pw-strength-label');
    if (!pw) { bar.style.width = '0%'; label.textContent = ''; return; }
    let score = 0;
    if (/[a-z]/.test(pw)) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/\d/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    bar.dataset.score = pw.length >= 8 ? score : 0;
    const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
    label.textContent = pw.length < 8 ? 'Too short' : (labels[score] || '');
  });
</script>
{% endblock %}

{% block auth_content %}
<div class="auth-card">
  <a class="auth-card__brand" href="/">
    <svg width="26" height="26" viewBox="0 0 30 30" fill="none" aria-hidden="true">
      <rect width="30" height="30" rx="6" fill="url(#rpg)"/>
      <path d="M8 22V8l14 14V8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <defs><linearGradient id="rpg" x1="0" y1="0" x2="30" y2="30"><stop stop-color="hsl(217,90%,62%)"/><stop offset="1" stop-color="hsl(199,85%,58%)"/></linearGradient></defs>
    </svg>
    Nexura
  </a>

  <h1 class="auth-card__title">Set a new password</h1>
  <p class="auth-card__subtitle">Choose a strong password you haven't used before.</p>

  {% if error %}
  <div role="alert"
       style="padding: var(--space-3) var(--space-4); background: hsla(355,72%,58%,0.10); border: 1px solid hsla(355,72%,58%,0.30); border-radius: var(--radius-lg); color: var(--accent-red); font-size: var(--text-sm); margin-bottom: var(--space-6);">
    {{ error }}
  </div>
  {% endif %}

  <form method="post" action="{{ url_for('auth.reset_password', token=token) }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="auth-field">
      <label class="auth-field__label" for="password">New Password</label>
      <input class="auth-field__input"
             type="password"
             id="password"
             name="password"
             placeholder="At least 8 characters"
             autocomplete="new-password"
             autofocus
             required>
      <div class="password-strength" aria-hidden="true">
        <div class="password-strength__bar" id="pw-strength-bar"></div>
      </div>
      <span class="password-strength__label" id="pw-strength-label" aria-live="polite"></span>
    </div>

    <div class="auth-field">
      <label class="auth-field__label" for="confirm_password">Confirm New Password</label>
      <input class="auth-field__input"
             type="password"
             id="confirm_password"
             name="confirm_password"
             placeholder="Repeat your new password"
             autocomplete="new-password"
             required>
    </div>

    <button class="btn btn--gradient btn--full btn--lg" type="submit" id="reset-submit">
      Update Password
    </button>
  </form>
</div>
{% endblock %}
