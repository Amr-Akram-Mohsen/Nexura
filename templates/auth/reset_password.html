{% extends "auth/base_auth.html" %}

{% block title %}Reset Password{% endblock %}

{% block extra_js %}
<script>
  document.getElementById('password').addEventListener('input', function() {
    const pw = this.value;
    const bar = document.getElementById('pw-strength-bar');
    const label = document.getElementById('pw-strength-label');
    if (!pw) { bar.style.width = '0%'; label.textContent = ''; return; }
    let score = 0;
    if (/[a-z]/.test(pw)) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/\d/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    bar.dataset.score = pw.length >= 8 ? score : 0;
    const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
    label.textContent = pw.length < 8 ? 'Too short' : (labels[score] || '');
  });
</script>
{% endblock %}

{% block auth_content %}
<div class="auth-card">
  <a class="auth-card__brand" href="/">
    <svg width="26" height="26" viewBox="0 0 30 30" fill="none" aria-hidden="true">
      <rect width="30" height="30" rx="6" fill="url(#rpg)"/>
      <path d="M8 22V8l14 14V8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <defs><linearGradient id="rpg" x1="0" y1="0" x2="30" y2="30"><stop stop-color="hsl(217,90%,62%)"/><stop offset="1" stop-color="hsl(199,85%,58%)"/></linearGradient></defs>
    </svg>
    Nexura
  </a>

  <h1 class="auth-card__title">Set a new password</h1>
  <p class="auth-card__subtitle">Choose a strong password you haven't used before.</p>

  {% if error %}
  <div class="alert alert--error" role="alert">
    <div class="alert__icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <div class="alert__content">
      <div class="alert__message">{{ error }}</div>
    </div>
    <button type="button" class="alert__close" aria-label="Dismiss error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
  {% endif %}

  <form method="post" action="{{ url_for('auth.reset_password', token=token) }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="auth-field">
      <label class="auth-field__label" for="password">New Password</label>
      <div class="auth-field__input-wrapper">
        <input class="auth-field__input"
               type="password"
               id="password"
               name="password"
               placeholder="At least 8 characters"
               autocomplete="new-password"
               autofocus
               required>
        <button type="button" class="auth-field__toggle-btn" aria-label="Show password" aria-pressed="false" tabindex="-1">
          <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      <div class="password-strength" aria-hidden="true">
        <div class="password-strength__bar" id="pw-strength-bar"></div>
      </div>
      <span class="password-strength__label" id="pw-strength-label" aria-live="polite"></span>
    </div>

    <div class="auth-field">
      <label class="auth-field__label" for="confirm_password">Confirm New Password</label>
      <div class="auth-field__input-wrapper">
        <input class="auth-field__input"
               type="password"
               id="confirm_password"
               name="confirm_password"
               placeholder="Repeat your new password"
               autocomplete="new-password"
               required>
        <button type="button" class="auth-field__toggle-btn" aria-label="Show password" aria-pressed="false" tabindex="-1">
          <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn btn--gradient btn--full btn--lg" type="submit" id="reset-submit">
      Update Password
    </button>
  </form>
</div>
{% endblock %}
