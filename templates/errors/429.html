{% extends "base.html" %}

{% block title %}429 — Rate Limit Exceeded | Nexura{% endblock %}

{% block content %}
<div class="site-container page-layout">
  <div class="empty-state" style="padding:var(--space-16) var(--space-4); max-width:600px; margin:0 auto; text-align:center;">
    <div style="font-family:var(--font-display); font-size:var(--text-4xl); font-weight:var(--weight-extrabold); color:var(--accent-violet); margin-bottom:var(--space-3);">
      429
    </div>
    <h1 class="empty-state__title" style="font-size:var(--text-2xl); margin-bottom:var(--space-2);">
      Too Many Requests
    </h1>
    <p class="empty-state__desc" style="color:var(--text-secondary); margin-bottom:var(--space-8); line-height:var(--leading-relaxed);">
      You have exceeded the request rate limit. Please pause for a moment and retry shortly.
    </p>
    <div style="display:flex; gap:var(--space-3); justify-content:center;">
      <a class="btn btn--secondary" href="javascript:location.reload()">Retry Now</a>
      <a class="btn btn--gradient" href="{{ url_for('public.home') }}">Return Home</a>
    </div>
  </div>
</div>
{% endblock %}
