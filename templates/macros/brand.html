{# Nexura Brand Logo Macro — centralized SVG representation with customizable size and gradient #}
{% macro brand_logo(size=30, class_name="navbar__logo-icon", grad_id="nexura-logo-grad") %}
  <svg class="{{ class_name }}"
       {% if size %}width="{{ size }}" height="{{ size }}"{% endif %}
       viewBox="0 0 30 30"
       fill="none"
       aria-hidden="true">
    <rect width="30" height="30" rx="6" fill="url(#{{ grad_id }})" />
    <path d="M8 22V8l14 14V8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <defs>
    <linearGradient id="{{ grad_id }}" x1="0" y1="0" x2="30" y2="30">
    <stop offset="0%" stop-color="hsl(217,90%,62%)" />
    <stop offset="100%" stop-color="hsl(199,85%,58%)" />
    </linearGradient>
    </defs>
  </svg>
{% endmacro %}
