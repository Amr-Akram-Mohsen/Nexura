{# templates/partials/_share_modal.html #}
<div class="share-modal-backdrop"
     id="share-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="share-modal-title">
  <div class="share-modal-card">
    <div class="share-modal-card__header">
      <h2 class="share-modal-card__title" id="share-modal-title">Share this story</h2>
      <button class="share-modal-card__close"
              aria-label="Close share dialog"
              type="button">
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <div class="share-copy-row">
      <span class="share-copy-url">{{ request.url }}</span>
      <button class="share-copy-btn"
              type="button"
              id="{% if video is defined and video %}video-share-copy-link-btn{% else %}share-copy-link-btn{% endif %}">
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        Copy Link
      </button>
    </div>
    <div class="share-grid" role="list">
      <a class="share-grid-item"
         href="#"
         target="_blank"
         rel="noopener noreferrer"
         data-platform="twitter"
         role="listitem"
         aria-label="Share on X (Twitter)">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.76l7.73-8.835L2.132 2.25h6.58l4.258 5.636L18.245 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
        </svg>
        X
      </a>
      <a class="share-grid-item"
         href="#"
         target="_blank"
         rel="noopener noreferrer"
         data-platform="linkedin"
         role="listitem"
         aria-label="Share on LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
          <rect x="2" y="9" width="4" height="12" /><circle cx="4" cy="4" r="2" />
        </svg>
        LinkedIn
      </a>
      <a class="share-grid-item"
         href="#"
         target="_blank"
         rel="noopener noreferrer"
         data-platform="whatsapp"
         role="listitem"
         aria-label="Share on WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z" />
        </svg>
        WhatsApp
      </a>
      <a class="share-grid-item"
         href="#"
         target="_blank"
         rel="noopener noreferrer"
         data-platform="reddit"
         role="listitem"
         aria-label="Share on Reddit">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path fill="white" d="M17.07 12.18A1.6 1.6 0 1 1 15 10.8a3.94 3.94 0 0 1 2.07.38zM8.46 11.2a1.13 1.13 0 1 0 1.13 1.13 1.13 1.13 0 0 0-1.13-1.13zm7.08 0a1.13 1.13 0 1 0 1.13 1.13 1.13 1.13 0 0 0-1.13-1.13zM12 15.9a3.27 3.27 0 0 1-2-.55.27.27 0 0 0-.37.37 3.8 3.8 0 0 0 2.34.72 3.8 3.8 0 0 0 2.34-.72.27.27 0 0 0-.37-.37A3.27 3.27 0 0 1 12 15.9zM6.93 12.18a3.94 3.94 0 0 1 2.07-.38A1.6 1.6 0 1 1 9 10.8z" />
          <circle fill="white" cx="12" cy="7" r="1.5" />
        </svg>
        Reddit
      </a>
    </div>
  </div>
</div>
